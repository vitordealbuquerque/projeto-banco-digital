<svg viewBox="0 0 960 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
    <title id="title">Estrutura do projeto Banco Digital</title>
    <desc id="desc">Diagrama mostrando o fluxo do projeto: extração em Python, modelo relacional no PostgreSQL com as tabelas clientes, produtos_cliente e transacoes, e dashboard final no Power BI.</desc>

    <rect width="960" height="560" fill="#F7F6F0"/>

    <text x="30" y="40" font-family="Segoe UI, Arial" font-size="20" font-weight="700" fill="#3E4B24">Banco Digital — Estrutura do Projeto</text>
    <text x="30" y="62" font-family="Segoe UI, Arial" font-size="13" fill="#6B7A44">Extração (Python) para Modelo relacional (PostgreSQL) para Dashboard (Power BI)</text>

    <g font-family="Segoe UI, Arial">
          <rect x="30" y="90" width="150" height="46" rx="6" fill="#556B2F"/>
          <text x="105" y="118" font-size="13" fill="#F7F6F0" text-anchor="middle" font-weight="600">Python (CSV)</text>

          <path d="M180 113 L212 113" stroke="#8A9A5B" stroke-width="2" marker-end="url(#arrow)"/>

          <rect x="212" y="90" width="150" height="46" rx="6" fill="#556B2F"/>
          <text x="287" y="118" font-size="13" fill="#F7F6F0" text-anchor="middle" font-weight="600">PostgreSQL 15</text>

          <path d="M362 113 L394 113" stroke="#8A9A5B" stroke-width="2" marker-end="url(#arrow)"/>

          <rect x="394" y="90" width="150" height="46" rx="6" fill="#556B2F"/>
          <text x="469" y="118" font-size="13" fill="#F7F6F0" text-anchor="middle" font-weight="600">SQL (CTE, Window)</text>

          <path d="M544 113 L576 113" stroke="#8A9A5B" stroke-width="2" marker-end="url(#arrow)"/>

          <rect x="576" y="90" width="150" height="46" rx="6" fill="#8A9A5B"/>
          <text x="651" y="118" font-size="13" fill="#1A1F14" text-anchor="middle" font-weight="600">Power BI</text>
    </g>

    <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
                  <path d="M0,0 L6,3 L0,6 Z" fill="#8A9A5B"/>
          </marker>
    </defs>

    <text x="30" y="185" font-family="Segoe UI, Arial" font-size="15" font-weight="700" fill="#3E4B24">Modelo relacional</text>

    <g font-family="Segoe UI, Arial">
          <rect x="30" y="205" width="240" height="230" rx="6" fill="#FFFFFF" stroke="#B8C08A" stroke-width="1.5"/>
          <rect x="30" y="205" width="240" height="34" rx="6" fill="#3E4B24"/>
          <rect x="30" y="221" width="240" height="18" fill="#3E4B24"/>
          <text x="150" y="228" font-size="14" font-weight="700" fill="#F7F6F0" text-anchor="middle">clientes</text>
          <text x="46" y="258" font-size="12" fill="#1A1F14" font-weight="700">cliente_id</text><text x="150" y="258" font-size="12" fill="#6B7A44">PK, INTEGER</text>
          <text x="46" y="278" font-size="12" fill="#1A1F14">idade</text><text x="180" y="278" font-size="11" fill="#8A8A78">SMALLINT</text>
          <text x="46" y="298" font-size="12" fill="#1A1F14">genero</text><text x="180" y="298" font-size="11" fill="#8A8A78">CHAR(1)</text>
          <text x="46" y="318" font-size="12" fill="#1A1F14">uf</text><text x="180" y="318" font-size="11" fill="#8A8A78">CHAR(2)</text>
          <text x="46" y="338" font-size="12" fill="#1A1F14">renda_mensal</text><text x="180" y="338" font-size="11" fill="#8A8A78">NUMERIC</text>
          <text x="46" y="358" font-size="12" fill="#1A1F14">segmento</text><text x="180" y="358" font-size="11" fill="#8A8A78">VARCHAR</text>
          <text x="46" y="378" font-size="12" fill="#1A1F14">canal_aquisicao</text><text x="180" y="378" font-size="10" fill="#8A8A78">VARCHAR</text>
          <text x="46" y="398" font-size="12" fill="#1A1F14">status</text><text x="180" y="398" font-size="11" fill="#8A8A78">VARCHAR</text>
          <text x="46" y="418" font-size="12" fill="#1A1F14">data_churn</text><text x="180" y="418" font-size="11" fill="#8A8A78">DATE</text>
    </g>

    <g font-family="Segoe UI, Arial">
          <rect x="360" y="205" width="240" height="150" rx="6" fill="#FFFFFF" stroke="#B8C08A" stroke-width="1.5"/>
          <rect x="360" y="205" width="240" height="34" rx="6" fill="#556B2F"/>
          <rect x="360" y="221" width="240" height="18" fill="#556B2F"/>
          <text x="480" y="228" font-size="14" font-weight="700" fill="#F7F6F0" text-anchor="middle">produtos_cliente</text>
          <text x="376" y="258" font-size="12" fill="#1A1F14" font-weight="700">registro_id</text><text x="500" y="258" font-size="12" fill="#6B7A44">PK, SERIAL</text>
          <text x="376" y="278" font-size="12" fill="#1A1F14" font-weight="700">cliente_id</text><text x="500" y="278" font-size="12" fill="#6B7A44">FK</text>
          <text x="376" y="298" font-size="12" fill="#1A1F14">produto</text><text x="500" y="298" font-size="11" fill="#8A8A78">VARCHAR</text>
          <text x="376" y="318" font-size="12" fill="#1A1F14">data_ativacao</text><text x="500" y="318" font-size="11" fill="#8A8A78">DATE</text>
          <text x="376" y="338" font-size="12" fill="#1A1F14">status_produto</text><text x="500" y="338" font-size="11" fill="#8A8A78">VARCHAR</text>
    </g>

    <g font-family="Segoe UI, Arial">
          <rect x="360" y="380" width="240" height="150" rx="6" fill="#FFFFFF" stroke="#B8C08A" stroke-width="1.5"/>
          <rect x="360" y="380" width="240" height="34" rx="6" fill="#556B2F"/>
          <rect x="360" y="396" width="240" height="18" fill="#556B2F"/>
          <text x="480" y="403" font-size="14" font-weight="700" fill="#F7F6F0" text-anchor="middle">transacoes</text>
          <text x="376" y="433" font-size="12" fill="#1A1F14" font-weight="700">transacao_id</text><text x="500" y="433" font-size="12" fill="#6B7A44">PK, BIGINT</text>
          <text x="376" y="453" font-size="12" fill="#1A1F14" font-weight="700">cliente_id</text><text x="500" y="453" font-size="12" fill="#6B7A44">FK</text>
          <text x="376" y="473" font-size="12" fill="#1A1F14">tipo</text><text x="500" y="473" font-size="11" fill="#8A8A78">VARCHAR (10)</text>
          <text x="376" y="493" font-size="12" fill="#1A1F14">data_transacao</text><text x="500" y="493" font-size="11" fill="#8A8A78">TIMESTAMP</text>
          <text x="376" y="513" font-size="12" fill="#1A1F14">valor</text><text x="500" y="513" font-size="11" fill="#8A8A78">NUMERIC</text>
    </g>

    <path d="M270 260 C 310 260, 320 250, 360 265" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
    <text x="292" y="252" font-size="11" fill="#6B7A44">1</text>
    <text x="345" y="258" font-size="11" fill="#6B7A44">N</text>

    <path d="M270 340 C 310 400, 320 420, 360 445" fill="none" stroke="#8A9A5B" stroke-width="1.5"/>
    <text x="292" y="365" font-size="11" fill="#6B7A44">1</text>
    <text x="345" y="440" font-size="11" fill="#6B7A44">N</text>

    <text x="640" y="480" font-family="Segoe UI, Arial" font-size="11" fill="#8A8A78">2.000 clientes, 5.345 ativações, 25.000 transações</text>
    <text x="30" y="548" font-family="Segoe UI, Arial" font-size="11" fill="#8A8A78">Vitor Franca, projeto de portfólio, PostgreSQL 15 + Power BI</text>
</svg>
